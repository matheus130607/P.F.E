<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Layout - Desktop</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sidebar">
        <a href="#" class="icon-link menu-top"><i data-lucide="instagram"></i></a>
        <a href="#" class="icon-link active"><i data-lucide="home"></i></a>
        <a href="#" class="icon-link"><i data-lucide="play-square"></i></a>
        <a href="#" class="icon-link notification"><i data-lucide="message-circle"></i></a>
        <a href="#" class="icon-link"><i data-lucide="search"></i></a>
        <a href="#" class="icon-link"><i data-lucide="compass"></i></a>
        <a href="#" class="icon-link dot-notification"><i data-lucide="heart"></i></a>
        <a href="#" class="icon-link"><i data-lucide="plus"></i></a>
        <a href="#" class="icon-link profile-pic">
            <img src="https://lh3.googleusercontent.com/a/ACg8ocIWvSwHXySmpkAjSODMf0cEqIa0fbHdKOhmmpG0V4xckdAdWK9d=s288-c-no"
                alt="Perfil">
        </a>
        <a href="#" class="icon-link menu-bottom"><i data-lucide="menu"></i></a>
    </div>

    <div class="main-container">

        <div class="feed-section">

            <div class="stories-container">
                <button class="nav-btn prev" id="prevStory"><i data-lucide="chevron-left"></i></button>
                <div class="navbar" id="storiesWrapper">
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=1" alt="S1"><span>User
                            1</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=2" alt="S2"><span>User
                            2</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=3" alt="S3"><span>User
                            3</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=4" alt="S4"><span>User
                            4</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=5" alt="S5"><span>User
                            5</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=6" alt="S6"><span>User
                            6</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=7" alt="S7"><span>User
                            7</span></a>
                </div>
                <button class="nav-btn next" id="nextStory"><i data-lucide="chevron-right"></i></button>
            </div>

            <div class="posts-container">

                <article class="post">
                    <div class="post-header">
                        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968763.png" alt="Perfil">
                        <span>Unsplash</span>
                        <i data-lucide="more-horizontal" class="more-icon"></i>
                    </div>

                    <div class="post-media-wrapper">
                        <button class="post-nav-btn p-prev"><i data-lucide="chevron-left"></i></button>
                        <div class="post-carousel">
                            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=600" alt="Img 1">
                            <img src="https://images.unsplash.com/photo-1516762689617-e1cffcef479d?w=600" alt="Img 2">
                            <img src="https://ix-marketing.imgix.net/focalpoint.png?auto=format,compress&w=1946"
                                alt="Img 3">
                            <img src="https://images.unsplash.com/photo-1771030666266-bc51b516d353?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw5fHx8ZW58MHx8fHx8"
                                alt="IMG 4">
                        </div>
                        <button class="post-nav-btn p-next"><i data-lucide="chevron-right"></i></button>
                    </div>

                    <div class="post-actions">
                        <div class="left-actions">
                            <i data-lucide="heart" class="action-icon like-btn"></i>
                            <i data-lucide="message-circle" class="action-icon"></i>
                            <i data-lucide="send" class="action-icon"></i>
                        </div>
                        <i data-lucide="bookmark" class="action-icon"></i>
                    </div>
                </article>

                <article class="post">
                    <div class="post-header">
                        <img src="https://i.pravatar.cc/150?u=8" alt="Perfil">
                        <span>Post 1</span>
                    </div>
                    <div class="post-media-wrapper">
                        <video controls muted class="feed-video">
                            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="post-actions">
                        <div class="left-actions">
                            <i data-lucide="heart" class="action-icon like-btn"></i>
                            <i data-lucide="message-circle" class="action-icon"></i>
                            <i data-lucide="send" class="action-icon"></i>
                        </div>
                        <i data-lucide="bookmark" class="action-icon"></i>
                    </div>
                </article>

            </div>
        </div>

        <div class="suggestions-section">
            <div class="user-profile-bar">
                <img src="https://lh3.googleusercontent.com/a/ACg8ocIWvSwHXySmpkAjSODMf0cEqIa0fbHdKOhmmpG0V4xckdAdWK9d=s288-c-no"
                    alt="Me">
                <div class="profile-info">
                    <strong>malamanmatheus</strong>
                    <span>Matheus Malaman</span>
                </div>
                <a href="#" class="switch-btn">Mudar</a>
            </div>
            <div class="suggestions-header">
                <span>Sugestões para você</span>
                <a href="#">Ver tudo</a>
            </div>
            <div class="suggestion-item">
                <img src="https://i.pravatar.cc/150?u=12" alt="Sug">
                <div class="profile-info">
                    <strong>cl_semi_joias</strong>
                    <span>Seguido por Jefferson</span>
                </div>
                <a href="#" class="follow-btn">Seguir</a>
            </div>

            <div class="suggestion-item">
                <img src="https://i.pravatar.cc/150?u=72" alt="Sug">
                <div class="profile-info">
                    <strong>Joel</strong>
                    <span>Seguido por Samuel</span>
                </div>
                <a href="#" class="follow-btn">Seguir</a>
            </div>

            <div class="suggestion-item">
                <img src="https://i.pravatar.cc/150?u=55" alt="Sug">
                <div class="profile-info">
                    <strong>Jefferson</strong>
                    <span>Seguido por andre.pttds...</span>
                </div>
                <a href="#" class="follow-btn">Seguir</a>
            </div>

            <div class="suggestion-item">
                <img src="https://i.pravatar.cc/150?u=53" alt="Sug">
                <div class="profile-info">
                    <strong>Samuel</strong>
                    <span>Seguido por ninguém</span>
                </div>
                <a href="#" class="follow-btn">Seguir</a>
            </div>
            
        </div>

    </div>

    <div id="storyModal" class="modal-overlay">
        <button id="closeModal" class="close-btn"><i data-lucide="x"></i></button>
        <div class="modal-content">
            <video id="storyVideo" loop muted>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        lucide.createIcons();

        /*CARROSSEL DE STORIES*/

        const storiesNavbar = document.getElementById("storiesWrapper");
        const stories = document.querySelectorAll(".icon-story");

        let storyIndex = 0;
        const storyWidth = 105;

        document.getElementById("nextStory").onclick = () => {

            if (storyIndex < stories.length - 4) {
                storyIndex++;
            }

            storiesNavbar.style.transform =
                `translateX(-${storyIndex * storyWidth}px)`;
        };

        document.getElementById("prevStory").onclick = () => {

            if (storyIndex > 0) {
                storyIndex--;
            }

            storiesNavbar.style.transform =
                `translateX(-${storyIndex * storyWidth}px)`;
        };


        /* MODAL DOS STORIES*/

        const modal = document.getElementById("storyModal");
        const storyVideo = document.getElementById("storyVideo");
        const closeModal = document.getElementById("closeModal");

        stories.forEach(story => {

            story.onclick = (e) => {
                e.preventDefault();

                modal.classList.add("active");

                storyVideo.currentTime = 0;
                storyVideo.play();
            };

        });

        closeModal.onclick = () => {

            modal.classList.remove("active");
            storyVideo.pause();

        };


        /*CARROSSEL DOS POSTS*/

        const posts = document.querySelectorAll(".post");

        posts.forEach(post => {

            const carousel = post.querySelector(".post-carousel");
            const images = post.querySelectorAll(".post-carousel img");
            const nextBtn = post.querySelector(".p-next");
            const prevBtn = post.querySelector(".p-prev");

            let index = 0;
            const width = 470;

            nextBtn.onclick = () => {

                if (index < images.length - 1) {
                    index++;
                }

                carousel.style.transform = `translateX(-${index * width}px)`;
            };

            prevBtn.onclick = () => {

                if (index > 0) {
                    index--;
                }

                carousel.style.transform = `translateX(-${index * width}px)`;
            };

        });
    </script>
</body>

</html>
