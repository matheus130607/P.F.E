<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Layout - Desktop</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <a href="#" class="icon-link menu-top"><i data-lucide="instagram"></i></a>
        <a href="#" class="icon-link active"><i data-lucide="home"></i></a>
        <a href="#" class="icon-link"><i data-lucide="play-square"></i></a>
        <a href="#" class="icon-link notification"><i data-lucide="message-circle"></i></a>
        <a href="#" class="icon-link"><i data-lucide="search"></i></a>
        <a href="#" class="icon-link"><i data-lucide="compass"></i></a>
        <a href="#" class="icon-link dot-notification"><i data-lucide="heart"></i></a>
        <a href="#" class="icon-link"><i data-lucide="plus"></i></a>
        <a href="#" class="icon-link profile-pic">
            <img src="https://lh3.googleusercontent.com/a/ACg8ocIWvSwHXySmpkAjSODMf0cEqIa0fbHdKOhmmpG0V4xckdAdWK9d=s288-c-no" alt="Perfil">
        </a>
        <a href="#" class="icon-link menu-bottom"><i data-lucide="menu"></i></a>
    </div>

    <div class="main-container">
        
        <div class="feed-section">
            
            <div class="stories-container">
                <button class="nav-btn prev" id="prevStory"><i data-lucide="chevron-left"></i></button>
                <div class="navbar" id="storiesWrapper">
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=1" alt="S1"><span>dri.hergert</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=2" alt="S2"><span>lebozza</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=3" alt="S3"><span>tk.machine</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=4" alt="S4"><span>thiago.geo</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=5" alt="S5"><span>andreia.pc</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=6" alt="S6"><span>mf_oliveira</span></a>
                    <a href="#" class="icon-story"><img src="https://i.pravatar.cc/150?u=7" alt="S7"><span>user.test</span></a>
                </div>
                <button class="nav-btn next" id="nextStory"><i data-lucide="chevron-right"></i></button>
            </div>

            <div class="posts-container">
                
                <article class="post">
                    <div class="post-header">
                        <img src="https://i.pravatar.cc/150?u=3" alt="Perfil">
                        <span>nautico_limeira</span>
                        <i data-lucide="more-horizontal" class="more-icon"></i>
                    </div>
                    
                    <div class="post-media-wrapper">
                        <button class="post-nav-btn p-prev"><i data-lucide="chevron-left"></i></button>
                        <div class="post-carousel">
                            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=600" alt="Img 1">
                            <img src="https://images.unsplash.com/photo-1516762689617-e1cffcef479d?w=600" alt="Img 2">
                        </div>
                        <button class="post-nav-btn p-next"><i data-lucide="chevron-right"></i></button>
                    </div>

                    <div class="post-actions">
                        <div class="left-actions">
                            <i data-lucide="heart" class="action-icon"></i>
                            <i data-lucide="message-circle" class="action-icon"></i>
                            <i data-lucide="send" class="action-icon"></i>
                        </div>
                        <i data-lucide="bookmark" class="action-icon"></i>
                    </div>
                </article>

                <article class="post">
                    <div class="post-header">
                        <img src="https://i.pravatar.cc/150?u=8" alt="Perfil">
                        <span>mcdvipaivaa</span>
                    </div>
                    <div class="post-media-wrapper">
                        <video controls muted class="feed-video">
                            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="post-actions">
                        <div class="left-actions">
                            <i data-lucide="heart" class="action-icon"></i>
                            <i data-lucide="message-circle" class="action-icon"></i>
                            <i data-lucide="send" class="action-icon"></i>
                        </div>
                        <i data-lucide="bookmark" class="action-icon"></i>
                    </div>
                </article>

            </div>
        </div>

        <div class="suggestions-section">
            <div class="user-profile-bar">
                <img src="https://lh3.googleusercontent.com/a/ACg8ocIWvSwHXySmpkAjSODMf0cEqIa0fbHdKOhmmpG0V4xckdAdWK9d=s288-c-no" alt="Me">
                <div class="profile-info">
                    <strong>malamanmatheus</strong>
                    <span>Matheus Malaman</span>
                </div>
                <a href="#" class="switch-btn">Mudar</a>
            </div>
            <div class="suggestions-header">
                <span>Sugestões para você</span>
                <a href="#">Ver tudo</a>
            </div>
            <div class="suggestion-item">
                <img src="https://i.pravatar.cc/150?u=12" alt="Sug">
                <div class="profile-info">
                    <strong>cl_semi_joias</strong>
                    <span>Seguido por andre.pttds...</span>
                </div>
                <a href="#" class="follow-btn">Seguir</a>
            </div>
        </div>

    </div>

    <div id="storyModal" class="modal-overlay">
        <button id="closeModal" class="close-btn"><i data-lucide="x"></i></button>
        <div class="modal-content">
            <video id="storyVideo" loop muted>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Lógica do Carrossel de Stories
        const wrapper = document.getElementById('storiesWrapper');
        document.getElementById('nextStory').onclick = () => wrapper.scrollLeft += 300;
        document.getElementById('prevStory').onclick = () => wrapper.scrollLeft -= 300;

        // Lógica do Modal de Stories
        const stories = document.querySelectorAll('.icon-story');
        const modal = document.getElementById('storyModal');
        const storyVideo = document.getElementById('storyVideo');

        stories.forEach(s => s.onclick = (e) => {
            e.preventDefault();
            modal.classList.add('active');
            storyVideo.play();
        });

        document.getElementById('closeModal').onclick = () => {
            modal.classList.remove('active');
            storyVideo.pause();
        };

        // Lógica do Carrossel do Post (Simples)
        document.querySelector('.p-next').onclick = () => {
            document.querySelector('.post-carousel').scrollLeft += 470;
        };
        document.querySelector('.p-prev').onclick = () => {
            document.querySelector('.post-carousel').scrollLeft -= 470;
        };
    </script>
</body>
</html>
