<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI SP - Cursos, Processo Seletivo e Unidades</title>
    <style>
        /* Variáveis de Cores */
        :root {
            --vermelho-senai: #E30613;
            --vermelho-escuro: #B3000A;
            --texto-escuro: #333333;
            --cinza-fundo: #EAEAEA;
            --branco: #FFFFFF;
            --cinza-claro: #F5F5F5;
        }

        /* Reset Básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: var(--cinza-fundo);
            min-height: 100vh;
        }

        /* UX: Foco visível para navegação por teclado (Acessibilidade) */
        a:focus-visible, button:focus-visible {
            outline: 2px dashed var(--vermelho-senai);
            outline-offset: 3px;
        }

        /* Container Principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* ==== BARRA SUPERIOR (VERMELHA) ==== */
        .top-bar {
            background-color: var(--vermelho-senai);
            color: var(--branco);
            font-size: 11px;
            font-weight: bold;
            height: 35px;
            display: flex;
            align-items: center;
        }

        .top-bar .container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .top-links {
            display: flex;
            list-style: none;
            gap: 5px; 
        }

        .top-links a {
            color: var(--branco);
            text-decoration: none;
            padding: 5px 10px; 
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .top-links a:hover {
            background-color: rgba(255, 255, 255, 0.1); 
            text-decoration: none;
        }

        /* Redes Sociais no Topo */
        .social-links {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 15px;
            padding-left: 15px;
            border-left: 1px solid rgba(255, 255, 255, 0.5);
        }

        .social-links a {
            color: var(--branco);
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 6px; 
            border-radius: 50%;
            transition: transform 0.2s, background-color 0.2s;
        }

        .social-links a:hover {
            transform: scale(1.15); 
            background-color: rgba(255, 255, 255, 0.1);
        }

        .social-links svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        /* ==== CABEÇALHO PRINCIPAL (BRANCO) ==== */
        .main-header {
            background-color: var(--branco);
            width: 100%;
            height: 90px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); 
            position: relative; /* Importante para o submenu mobile */
            z-index: 100;
        }

        .main-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        /* Logo - CORRIGIDO O TAMANHO */
        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 200px; /* Ajustado para caber perfeitamente no cabeçalho */
            width: auto;
            max-width: 100%;
        }

        /* Navegação e Ações (Grupo à direita) */
        .header-right {
            display: flex;
            align-items: center;
            flex-grow: 1;
            justify-content: flex-end;
            height: 100%;
            padding-top: 15px;
        }

        /* O contêiner da linha vermelha */
        .nav-wrapper {
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--vermelho-senai);
            padding-bottom: 8px; 
            margin-top: 10px;
        }

        /* Conteúdo do Menu (Links + Botões) */
        .menu-content {
            display: flex;
            align-items: center;
        }

        /* Menu Principal */
        .main-nav {
            display: flex;
            list-style: none;
            gap: 20px;
            margin-right: 30px;
        }

        .main-nav a {
            text-decoration: none;
            color: var(--texto-escuro);
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .main-nav a:hover {
            color: var(--vermelho-senai);
        }

        /* Ações: Busca e Login */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: var(--texto-escuro);
        }

        .search-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .search-btn:hover {
            color: var(--vermelho-senai);
        }

        .divider {
            width: 2px;
            height: 20px;
            background-color: #DDDDDD; 
        }

        .login-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--texto-escuro);
            font-size: 13px;
            font-weight: bold;
            background-color: var(--cinza-claro); 
            padding: 8px 18px; 
            border-radius: 20px; 
            transition: all 0.2s;
        }

        .login-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .login-btn:hover {
            background-color: var(--vermelho-senai); 
            color: var(--branco);
        }

        /* ==== UX: BOTÃO DE MENU MOBILE ==== */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--texto-escuro);
            padding: 8px;
            margin-left: 15px;
        }

        .mobile-menu-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* ==== BOTÃO DE ACESSIBILIDADE ==== */
        .accessibility-btn {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            background-color: var(--vermelho-senai);
            width: 50px;
            height: 50px;
            border-radius: 0 25px 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 3px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: background-color 0.3s, transform 0.2s; 
        }

        .accessibility-btn:hover {
            background-color: var(--vermelho-escuro); 
            transform: translateY(-50%) scale(1.05); 
        }

        .accessibility-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--branco);
        }

        /* ==== ÁREA DE CONTEÚDO ==== */
        main {
            width: 100%;
            height: calc(100vh - 125px); 
        }

        /* ==== UX: MEDIA QUERIES (RESPONSIVIDADE E MENU MOBILE FUNCIONAL) ==== */
        @media (max-width: 992px) {
            .nav-wrapper {
                border-bottom: none;
                margin-top: 0;
                padding-bottom: 0;
            }
            .mobile-menu-btn {
                display: block; /* Mostra o botão hambúrguer */
            }
            .top-links {
                display: none; /* Esconde links de texto no topo em mobile */
            }
            .social-links {
                border-left: none;
                margin-left: 0;
                padding-left: 0;
                width: 100%;
                justify-content: center;
            }
            .top-bar .container {
                justify-content: center;
            }

            /* Configuração do Menu Mobile (Escondido por padrão, exibido no clique) */
            .menu-content {
                display: none; /* Oculta na versão mobile inicialmente */
                flex-direction: column;
                position: absolute;
                top: 90px; /* Logo abaixo do cabeçalho */
                left: 0;
                width: 100%;
                background-color: var(--branco);
                box-shadow: 0 10px 15px rgba(0,0,0,0.1);
                padding: 20px 0;
                border-top: 1px solid var(--cinza-fundo);
            }
            .menu-content.active {
                display: flex; /* Classe ativada pelo JS */
            }
            
            /* Ajustes nos links e botões para o layout Mobile */
            .main-nav {
                flex-direction: column;
                margin: 0 0 20px 0;
                width: 100%;
                gap: 0;
            }
            .main-nav li {
                width: 100%;
                text-align: center;
            }
            .main-nav a {
                display: block;
                padding: 15px 20px;
                font-size: 16px;
                border-bottom: 1px solid var(--cinza-fundo);
            }
            .header-actions {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }
            .divider {
                display: none; /* Esconde a linha divisória em mobile */
            }
            .login-btn {
                width: 80%;
                justify-content: center;
            }
        }
    </style>
</head>

    </main>

    <!-- Script para funcionamento do Menu Mobile -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const menuContent = document.getElementById('menuContent');

            // Alterna a classe 'active' para exibir/ocultar o menu
            menuBtn.addEventListener('click', () => {
                menuContent.classList.toggle('active');
            });
        });
    </script>
